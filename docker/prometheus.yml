global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: 'taskmanager'
    static_configs:
      - targets: ['app:9118']
    metrics_path: '/metrics'
  - job_name: 'mariadb'
    static_configs:
      - targets: ['mariadb:9187']
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

